name: Test Setup

on:
  workflow_dispatch:   # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔐 Check required secrets
      - name: Check secrets are configured
        env:
          ACCOUNT_SID: ${{ secrets.ACCOUNT_SID }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          FROM_NO: ${{ secrets.FROM_NO }}
          TO_NO: ${{ secrets.TO_NO }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}

        run: |

          echo "Checking secrets..."

          if [ -z "$ACCOUNT_SID" ]; then
            echo "ACCOUNT_SID secret is not set!"
            exit 1
          else
            echo "ACCOUNT_SID OK"
          fi

          if [ -z "$AUTH_TOKEN" ]; then
            echo "AUTH_TOKEN secret is not set!"
            exit 1
          else
            echo "AUTH_TOKEN OK"
          fi

          if [ -z "$FROM_NO" ]; then
            echo "FROM_NO secret is not set!"
            exit 1
          else
            echo "FROM_NO OK"
          fi

          if [ -z "$TO_NO" ]; then
            echo "TO_NO secret is not set!"
            exit 1
          else
            echo "TO_NO OK"
          fi

          if [ -z "$OWM_API_KEY" ]; then
            echo "OWM_API_KEY secret is not set!"
            exit 1
          else
            echo "OWM_API_KEY OK"
          fi

          echo ""
          echo "All secrets are configured!"

      # 📂 Check files
      - name: Check required files exist
        run: |
          echo "Checking required files..."

          if [ -f "main.py" ]; then
            echo "main.py found"
          else
            echo "main.py not found!"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "requirements.txt found"
          else
            echo "requirements.txt not found!"
            exit 1
          fi

          echo ""
          echo "All required files found!"

      # 🐍 Python syntax test
      - name: Test Python syntax
        run: python -m py_compile main.py

      # 🎉 Success message
      - name: Success
        run: |
          echo ""
          echo "======================================="
          echo " All checks passed!"
          echo " GitHub Actions setup is working"
          echo "======================================="
